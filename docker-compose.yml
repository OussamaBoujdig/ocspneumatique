version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: tiregarage-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-tiregarage123}
      MYSQL_DATABASE: ${DB_NAME:-tiregarage}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tiregarage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tiregarage-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-tiregarage123}
      DB_NAME: ${DB_NAME:-tiregarage}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      PORT: 3001
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
